name: ETH 15 Minute Prediction

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Get bot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run prediction
        run: python bot.py
